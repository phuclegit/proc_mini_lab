services:
  app:
    image: app_labprocmini:latest
    container_name: flask_app
    env_file:
      - .env
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    container_name: redis_server
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend
    depends_on:
      - app
    restart: always

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: always

networks:
  backend:
    driver: bridge
    external: true
    name: backend

volumes:
  redis_data:
  postgres_data:
